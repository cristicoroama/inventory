<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-secondary mb-4">
  <div class="container-fluid">
    <a href="{% url 'dashboard' %}" class="navbar-brand">Inventory Dashboard</a>
    <a href="{% url 'device_list' %}" class="btn btn-outline-light btn-sm">Devices</a>
  </div>
</nav>

<div class="container">
  <h3 class="mb-3">{{ title }}</h3>

  <div class="card bg-secondary text-light">
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="row">
          {% for field in form %}
            <div class="mb-3 col-md-6">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-warning small">{{ field.errors|striptags }}</div>
              {% endif %}
            </div>
          {% endfor %}
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'device_list' %}" class="btn btn-outline-light ms-2">Cancel</a>
      </form>
    </div>
  </div>
</div>

</body>
</html>
